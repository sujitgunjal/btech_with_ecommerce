global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:9464]

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: docker-metrics-exporter
    static_configs:
      - targets: [docker-metrics-exporter:9101]
